name: Build Windows exe

# Builds WallpaperStudio.exe with PyInstaller and publishes it to a
# GitHub Release. Triggered manually from the Actions tab, or automatically
# when you push a tag like v1.0.0.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke test (unit tests + import)
        run: |
          pip install pytest
          pytest tests -q
        env:
          PYTHONPATH: src

      - name: Build exe (PyInstaller, one-file, windowed)
        run: pyinstaller --clean --noconfirm build.spec

      - name: Upload artifact (raw exe)
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperStudio-exe
          path: dist/WallpaperStudio.exe

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/WallpaperStudio.exe -DestinationPath dist/WallpaperStudio-win-x64.zip

      - name: Create GitHub Release with exe attached
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WallpaperStudio.exe
            dist/WallpaperStudio-win-x64.zip
          generate_release_notes: true
